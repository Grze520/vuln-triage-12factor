name: 12-Factor DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase (Factor I)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Security Scanners (Factor II)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit

      - name: SAST - Bandit Python Security Scan
        run: bandit -r app.py admin_seed.py -ll

      - name: SCA - Dependency Vulnerability Audit
        run: pip-audit -r requirements.txt

      - name: IaC Scan - Trivy Dockerfile Check
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "Dockerfile"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Build Hardened Container Image (Factor V)
        run: docker build -t vuln-triage-12factor:${{ github.sha }} .

      - name: Container Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "vuln-triage-12factor:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
